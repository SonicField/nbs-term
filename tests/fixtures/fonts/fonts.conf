<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  tests/fixtures/fonts/fonts.conf — fontconfig override scoped to the
  test fixture directory.

  Per theologian (option-A) spec 2026-05-14 09:47:07 + supervisor
  09:46:12 GO. Pinning DejaVu Sans Mono via this config + FONTCONFIG_PATH
  override (set by the test harness) makes goldens deterministic across
  developer machines + CI; without it, fontconfig picks whatever
  monospace happens to be installed on PATH and cell metrics drift
  (testkeeper P1 09:20:51 root cause).

  Scope: this dir only. <dir> entries are read by fontconfig when
  FONTCONFIG_PATH points at this file's parent.
-->
<fontconfig>
    <dir prefix="cwd">.</dir>
    <cachedir>/tmp/nbs-term-fontcache</cachedir>
</fontconfig>
