# nbs-term pure-phc CI
#
# Builds and self-tests the standalone phc binary on Linux, macOS, and Windows.
# Empirically catches per-platform regressions (e.g. the RGB-macro collision
# that previously surfaced only on alexie's manual Win smoke).
#
# Per supervisor 2026-05-05 16:50:00 (alexie 16:49:07: "we should be able to
# make GH actions which to build and test on windows, mac and linux").

name: Pure-phc Build & Test

on:
  push:
    branches: [pure-phc-master]
  pull_request:
    branches: [pure-phc-master]

jobs:
  linux-build:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host build deps (X11 for Tk + xvfb for headless run)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xvfb \
            libx11-dev libxext-dev libxss-dev libxft-dev \
            libfontconfig-dev libfreetype-dev

      - name: Cache vendored Tcl/Tk build
        id: tcl-cache
        uses: actions/cache@v4
        with:
          path: deps/tcl-build
          key: tcl-tk-build-linux-${{ hashFiles('deps/tcl/unix/configure', 'deps/tcl/generic/tcl.h', 'deps/tk/unix/configure', 'deps/tk/generic/tk.h') }}

      - name: Build vendored Tcl/Tk
        if: steps.tcl-cache.outputs.cache-hit != 'true'
        run: make tcl-tk

      - name: Build phc compiler
        run: make phc

      - name: Build pure-phc binaries
        run: make p3_pty

      - name: Verify pure-phc invariants
        run: make verify-phc-invariants

      - name: Self-test (xvfb-run build/p3_pty -test)
        run: xvfb-run -a build/p3_pty -test

      - name: Burst test (PTY layer, no Tk — diagnostic)
        # `if: always()` so the burst diagnostic runs even when the prior
        # self-test fails — preserves the PTY-vs-Tk-render layer comparison.
        if: always()
        run: |
          make build/test_pty_burst
          build/test_pty_burst

      - name: F1 selection-arithmetic shim (test_pixel_to_cell)
        # Bisect-grade discriminator for F1 e0665eb — pythia #76 +
        # supervisor 17:48:58. Headless libc-only; PASS narrows any
        # 'wrong cells' report to render-side (A2/A3a/C).
        if: always()
        run: |
          make build/test_pixel_to_cell
          build/test_pixel_to_cell

      - name: F2 byte-extract shim (test_extract_utf8)
        # Bisect-grade discriminator for F2 f391992 — pythia #77 +
        # supervisor 18:26:48. Headless libc-only; PASS narrows any
        # 'copy wrong' report to selection-state upstream OR Tk
        # clipboard downstream.
        if: always()
        run: |
          make build/test_extract_utf8
          build/test_extract_utf8

      - name: T1 H gamma + dim shim (test_render_gamma)
        # Bisect-grade discriminator for H gamma transform (commit 17fe5dc)
        # per testkeeper coverage 2026-05-13 09:41:25 + alexie 09:46:53
        # automated-suite directive. Headless libc + libm.
        if: always()
        run: |
          make build/test_render_gamma
          build/test_render_gamma

      - name: T2 D special-keys + modifiers shim (test_input_keys)
        # Bisect-grade discriminator for D port (commit a592576) per
        # testkeeper coverage 2026-05-13 09:41:25. Headless libc only
        # (input.phc transitive sgr/screen defs).
        if: always()
        run: |
          make build/test_input_keys
          build/test_input_keys

      - name: T3 A2 origin + bbox-calibration shim (test_compute_layout)
        # Bisect-grade discriminator for A2 port (commit b37fcd1) per
        # testkeeper coverage 2026-05-13 09:41:25. Headless libc only;
        # SPEC COPY of p3_pty.phc:466-477 + 506-510.
        if: always()
        run: |
          make build/test_compute_layout
          build/test_compute_layout

      - name: T4 J-resize TIOCSWINSZ shim (test_pty_resize)
        # Bisect-grade discriminator for pty_resize POSIX (pty.phc:255-261)
        # per testkeeper coverage 2026-05-13 09:41:25. POSIX path; openpty
        # via -lutil. Win SKIP banner on the cross-platform CI runner.
        if: always()
        run: |
          make build/test_pty_resize
          build/test_pty_resize

      - name: T0 state-dump harness smoke (test_render_state + smoke_hello.tcl)
        # Bucket B harness round-trip per d9bba41 (theologian harness +
        # footgun guard). Discharges the harness binary build/link surface;
        # golden compare via xvfb-run on Linux. Per-platform goldens at
        # tests/goldens/<surface>.{linux,mac,win}.golden.txt; harness
        # owns the platform splice (footgun guard refuses pre-suffixed paths).
        id: t0_smoke
        if: always()
        run: |
          make build/test_render_state
          xvfb-run -a build/test_render_state tests/scripts/smoke_hello.tcl tests/goldens/smoke_hello.golden.txt

      - name: Upload T0 .actual artifacts on T0 failure
        # When T0 golden compare fails, the harness writes the on-disk
        # canvas dump to tests/goldens/<surface>.<platform>.golden.txt.actual.
        # Capturing these as workflow artifacts is the canonical way to
        # bootstrap per-platform goldens (per testkeeper 10:47:03 fix-forward
        # plan + supervisor 11:17:11 GO option A): a maintainer downloads
        # the artifact, inspects, commits the file as the golden — preserves
        # the CI=true update-goldens guard (defense-in-depth against silent
        # masking) by keeping the commit-the-golden step human-mediated.
        if: always() && steps.t0_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: t0-actual-linux
          path: tests/goldens/*.actual
          if-no-files-found: ignore

      - name: T0 A1 color renderer (test_render_state + a1_color.tcl)
        # Bucket B per-surface test for A1 (per testkeeper 12:38:19 Option 1
        # per-surface step shape + supervisor 12:20:28 GO + 09:52:11 start
        # order). Discriminator for A1 (commit 439c7cc + c776668 — port of
        # legacy extension.phc:982-1107 span-split renderer): if alexie
        # reports 'colours wrong / row-uniform' AND this passes, bug is in
        # g_config palette load OR cell color storage upstream of
        # render_screen; if this fails, regression is inside flush_span /
        # cells_same_span / per-span fg/bg/font emission.
        id: t0_a1_color
        if: always()
        run: |
          xvfb-run -a build/test_render_state tests/scripts/a1_color.tcl tests/goldens/a1_color.golden.txt

      - name: Upload T0 A1 color .actual on failure
        if: always() && steps.t0_a1_color.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: t0-actual-a1-color-linux
          path: tests/goldens/a1_color.*.actual
          if-no-files-found: ignore

      - name: T0 A3a PreferencesDialog (test_render_state + a3a_prefs.tcl)
        # Bucket B per-surface test for A3a (commit 2e57d0d — Prefs
        # Toplevel + Ctrl+, / Cmd+, bind). Discriminator: if alexie
        # reports 'Prefs does not open' OR 'Prefs fields show wrong
        # values' AND this passes, bug is in keybinding chain (Tk
        # infrastructure); if this fails, regression is inside
        # NbsOpenPrefs widget construction or g_config → ::prefs_*
        # var population. Per theologian 12:53:01 Option 1 — script
        # asserts inline; harness exits non-zero on Tcl error.
        id: t0_a3a_prefs
        if: always()
        run: |
          xvfb-run -a build/test_render_state tests/scripts/a3a_prefs.tcl tests/goldens/a3a_prefs.golden.txt

      - name: Upload T0 A3a Prefs .actual on failure
        if: always() && steps.t0_a3a_prefs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: t0-actual-a3a-prefs-linux
          path: tests/goldens/a3a_prefs.*.actual
          if-no-files-found: ignore

      - name: T0 F mouse selection (test_render_state + f_mouse.tcl)
        # Bucket B per-surface test for F1 (commit e0665eb — port of
        # legacy extension.phc:1240+ Terminal_draw_selection split-
        # render + flush_span emit_sub helper at p3_pty.phc:716-719).
        # Discriminator: if alexie reports 'selection highlight wrong
        # / missing' AND this passes, bug is in NbsSelDown/Drag/Up
        # button-event arithmetic OR Tk binding chain (pixel→cell
        # mapping covered by F1 test_pixel_to_cell unit test); if
        # this fails, regression is inside flush_span split-render.
        id: t0_f_mouse
        if: always()
        run: |
          xvfb-run -a build/test_render_state tests/scripts/f_mouse.tcl tests/goldens/f_mouse.golden.txt

      - name: Upload T0 F mouse .actual on failure
        if: always() && steps.t0_f_mouse.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: t0-actual-f-mouse-linux
          path: tests/goldens/f_mouse.*.actual
          if-no-files-found: ignore

      - name: T0 F copy clipboard (test_render_state + f_copy.tcl)
        # Bucket B per-surface test for F2 (commit f391992 — NbsCopy
        # walk + utf8_emit + Tk clipboard via Tcl_EvalObjv).
        # Discriminator: if alexie reports 'copy gives wrong text'
        # AND this passes, bug is in selection-state upstream OR Tk
        # clipboard daemon downstream; if this fails, regression is
        # inside NbsCopy walk OR utf8_emit + row_sel_range (covered
        # by F2 test_extract_utf8 unit test).
        id: t0_f_copy
        if: always()
        run: |
          xvfb-run -a build/test_render_state tests/scripts/f_copy.tcl tests/goldens/f_copy.golden.txt

      - name: Upload T0 F copy .actual on failure
        if: always() && steps.t0_f_copy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: t0-actual-f-copy-linux
          path: tests/goldens/f_copy.*.actual
          if-no-files-found: ignore

  mac-build:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vendored Tcl/Tk build
        id: tcl-cache
        uses: actions/cache@v4
        with:
          path: deps/tcl-build
          key: tcl-tk-build-mac-${{ hashFiles('deps/tcl/unix/configure', 'deps/tcl/generic/tcl.h', 'deps/tk/unix/configure', 'deps/tk/generic/tk.h') }}

      - name: Build vendored Tcl/Tk
        if: steps.tcl-cache.outputs.cache-hit != 'true'
        run: make tcl-tk

      - name: Build phc compiler
        run: make phc

      - name: Build pure-phc binaries
        run: make p3_pty

      - name: Verify pure-phc invariants
        run: make verify-phc-invariants

      - name: Self-test (build/p3_pty -test)
        run: build/p3_pty -test

      - name: Burst test (PTY layer, no Tk — diagnostic)
        # `if: always()` so the burst diagnostic runs even when the prior
        # self-test fails — preserves the PTY-vs-Tk-render layer comparison.
        if: always()
        run: |
          make build/test_pty_burst
          build/test_pty_burst

      - name: F1 selection-arithmetic shim (test_pixel_to_cell)
        # Bisect-grade discriminator for F1 e0665eb — pythia #76 +
        # supervisor 17:48:58. Headless libc-only.
        if: always()
        run: |
          make build/test_pixel_to_cell
          build/test_pixel_to_cell

      - name: F2 byte-extract shim (test_extract_utf8)
        # Bisect-grade discriminator for F2 f391992 — pythia #77 +
        # supervisor 18:26:48. Headless libc-only.
        if: always()
        run: |
          make build/test_extract_utf8
          build/test_extract_utf8

      - name: T1 H gamma + dim shim (test_render_gamma)
        # Bisect-grade discriminator for H gamma transform (commit 17fe5dc)
        # per testkeeper coverage 2026-05-13 09:41:25. Headless libc + libm.
        if: always()
        run: |
          make build/test_render_gamma
          build/test_render_gamma

      - name: T2 D special-keys + modifiers shim (test_input_keys)
        # Bisect-grade discriminator for D port (commit a592576) per
        # testkeeper coverage 2026-05-13 09:41:25. Headless libc only.
        if: always()
        run: |
          make build/test_input_keys
          build/test_input_keys

      - name: T3 A2 origin + bbox-calibration shim (test_compute_layout)
        # Bisect-grade discriminator for A2 port (commit b37fcd1) per
        # testkeeper coverage 2026-05-13 09:41:25. SPEC COPY of
        # p3_pty.phc:466-477 + 506-510. Headless libc only.
        if: always()
        run: |
          make build/test_compute_layout
          build/test_compute_layout

      - name: T4 J-resize TIOCSWINSZ shim (test_pty_resize)
        # Bisect-grade discriminator for pty_resize POSIX (pty.phc:255-261)
        # per testkeeper coverage 2026-05-13 09:41:25. macOS pulls openpty
        # from libSystem (no -lutil needed; harmless if linker drops).
        if: always()
        run: |
          make build/test_pty_resize
          build/test_pty_resize

      - name: T0 state-dump harness smoke (test_render_state + smoke_hello.tcl)
        # Bucket B harness round-trip per d9bba41. macOS Aqua window-server
        # is built-in (no Xvfb wrapper needed); empirically confirmed
        # available per CI run 25793943968 2026-05-13 (T0 binary built +
        # ran + generated dump on macos-latest).
        id: t0_smoke
        if: always()
        run: |
          make build/test_render_state
          build/test_render_state tests/scripts/smoke_hello.tcl tests/goldens/smoke_hello.golden.txt

      - name: Upload T0 .actual artifacts on T0 failure
        # See linux-build job comment — same fix-forward plan to bootstrap
        # the per-platform mac golden (testkeeper 10:47:03 + supervisor
        # 11:17:11 GO option A).
        if: always() && steps.t0_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: t0-actual-mac
          path: tests/goldens/*.actual
          if-no-files-found: ignore

      - name: T0 A1 color renderer (test_render_state + a1_color.tcl)
        # Bucket B per-surface test for A1 (per testkeeper 12:38:19 Option 1
        # per-surface step shape + supervisor 12:20:28 GO + 09:52:11 start
        # order). macOS Aqua direct, no Xvfb. Discriminator per linux-build
        # job comment.
        id: t0_a1_color
        if: always()
        run: |
          build/test_render_state tests/scripts/a1_color.tcl tests/goldens/a1_color.golden.txt

      - name: Upload T0 A1 color .actual on failure
        if: always() && steps.t0_a1_color.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: t0-actual-a1-color-mac
          path: tests/goldens/a1_color.*.actual
          if-no-files-found: ignore

      - name: T0 A3a PreferencesDialog (test_render_state + a3a_prefs.tcl)
        # Bucket B per-surface test for A3a (commit 2e57d0d). macOS Aqua
        # direct, no Xvfb. Discriminator per linux-build job comment.
        id: t0_a3a_prefs
        if: always()
        run: |
          build/test_render_state tests/scripts/a3a_prefs.tcl tests/goldens/a3a_prefs.golden.txt

      - name: Upload T0 A3a Prefs .actual on failure
        if: always() && steps.t0_a3a_prefs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: t0-actual-a3a-prefs-mac
          path: tests/goldens/a3a_prefs.*.actual
          if-no-files-found: ignore

      - name: T0 F mouse selection (test_render_state + f_mouse.tcl)
        # Bucket B per-surface test for F1 (commit e0665eb). macOS Aqua
        # direct, no Xvfb. Discriminator per linux-build job comment.
        id: t0_f_mouse
        if: always()
        run: |
          build/test_render_state tests/scripts/f_mouse.tcl tests/goldens/f_mouse.golden.txt

      - name: Upload T0 F mouse .actual on failure
        if: always() && steps.t0_f_mouse.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: t0-actual-f-mouse-mac
          path: tests/goldens/f_mouse.*.actual
          if-no-files-found: ignore

      - name: T0 F copy clipboard (test_render_state + f_copy.tcl)
        # Bucket B per-surface test for F2 (commit f391992). macOS Aqua
        # direct, no Xvfb. Discriminator per linux-build job comment.
        id: t0_f_copy
        if: always()
        run: |
          build/test_render_state tests/scripts/f_copy.tcl tests/goldens/f_copy.golden.txt

      - name: Upload T0 F copy .actual on failure
        if: always() && steps.t0_f_copy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: t0-actual-f-copy-mac
          path: tests/goldens/f_copy.*.actual
          if-no-files-found: ignore

  win-build:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vendored Tcl/Tk build
        id: tcl-cache
        uses: actions/cache@v4
        with:
          path: deps/tcl-build
          key: tcl-tk-build-win-${{ hashFiles('deps/tcl/win/makefile.vc', 'deps/tcl/generic/tcl.h', 'deps/tk/win/makefile.vc', 'deps/tk/generic/tk.h') }}

      - name: Run windows-setup-phc.ps1
        # Single script does MSVC import + vendored Tcl/Tk build (cache-aware via
        # tcl86.lib markers) + phc compiler + p3_pty.exe + test_pty_burst.exe +
        # two self-tests (burst PTY-only direct-exec producer + p3_pty Tk-render)
        # with diagnostic comparison + zero-Python-linkage check. All tests run
        # unconditionally inside the script. Burst test uses direct-exec producer
        # (post-(iii) canonicalisation, a0ed609).
        run: .\scripts\windows-setup-phc.ps1

      - name: Upload T0 .actual artifacts (always; .ps1 atomicity)
        # Win .ps1 is atomic — can't isolate T0 step outcome the way Linux/Mac
        # .yml jobs can. Always upload to capture T0 .actual when present;
        # if-no-files-found: ignore handles the success-case (no .actual
        # exists when T0 PASSes). Same fix-forward plan to bootstrap the
        # per-platform win golden (testkeeper 10:47:03 + supervisor 11:17:11
        # GO option A).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-actual-win
          path: tests/goldens/*.actual
          if-no-files-found: ignore
